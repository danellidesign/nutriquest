<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriQuest</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .xp-bar { background: #ddd; border-radius: 10px; height: 20px; overflow: hidden; margin-top: 10px; }
        .xp-fill { background: #4caf50; width: 85%; height: 100%; transition: width 0.5s; }
        .btn { display: block; width: 100%; padding: 10px; background: #007bff; color: white; text-align: center; text-decoration: none; border-radius: 5px; margin-top: 20px; font-weight: bold; cursor: pointer; border: none; }
        #reader { width: 100%; margin-top: 20px; display: none; }
        #resultArea { margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 5px; text-align: center; display: none; border: 1px solid #4caf50; }
        #auth-container, #app-container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>

<div id="auth-container">
    <h2 style="text-align: center;">Willkommen bei NutriQuest</h2>
    <input type="text" id="username" placeholder="Nutzername">
    <input type="password" id="password" placeholder="Passwort">
    <button class="btn" onclick="login()">Einloggen</button>
    <button class="btn" style="background: #9e9e9e;" onclick="register()">Registrieren</button>
    <p id="auth-message" style="color: red; text-align: center;"></p>
</div>

<div id="app-container" style="display: none;">
    <div class="header">
        <h2>NutriQuest</h2>
        <p><strong>Nickname</strong></p>
        <p id="levelDisplay">⭐ Level 5</p>
        <div class="xp-bar">
            <div class="xp-fill" id="xpFill" style="width: 85%;"></div>
        </div>
        <small id="xpText">850 / 1000 XP</small>
    </div>

    <div style="text-align: center; margin: 30px 0;">
        <h1 id="kcalDisplay" style="color: #e53935;">1200 kcal</h1>
        <p>heute noch übrig</p>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0; background: #eee; padding: 10px; border-radius: 8px;">
        <button onclick="changeDate(-1)" style="border: none; background: none; font-size: 1.2em; cursor: pointer;">◀</button>
        <strong id="dateDisplay" style="font-size: 0.9em;">Heute</strong>
        <button onclick="changeDate(1)" style="border: none; background: none; font-size: 1.2em; cursor: pointer;">▶</button>
    </div>

    <div style="text-align: left; margin-bottom: 20px; background: #fafafa; padding: 10px; border-radius: 5px; border: 1px solid #ddd;">
        <h4 style="margin: 0 0 10px 0; border-bottom: 1px solid #ccc; padding-bottom: 5px;">🍽️ Gegessen an diesem Tag:</h4>
        <div id="mealList" style="font-size: 0.9em; color: #555;">Noch keine Mahlzeiten eingetragen.</div>
    </div>

    <button class="btn" id="scanBtn">📷 Barcode Scannen</button>
    <div id="reader"></div>

    <div id="resultArea">
        <h3 style="margin: 0; color: #2e7d32;">Code erkannt!</h3>
        <p id="barcodeResult"></p>
    </div>
    <button class="btn" style="background: #ff5252;" onclick="logout()">Ausloggen</button>
</div>

<script>
    const scanBtn = document.getElementById('scanBtn');
    const readerDiv = document.getElementById('reader');
    const resultArea = document.getElementById('resultArea');
    const barcodeResult = document.getElementById('barcodeResult');
    let html5QrcodeScanner;
    let loggedInUserId = null;
    let currentSelectedDate = new Date().toISOString().split('T')[0];

    // add click handler to scan button
    scanBtn.addEventListener('click', () => {
        scanBtn.style.display = 'none';
        readerDiv.style.display = 'block';
        resultArea.style.display = 'none';

        // init QR-Code scanner object
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false
        );

        html5QrcodeScanner.render(onScanSuccess);
    });

    function onScanSuccess(decodedText) {
        html5QrcodeScanner.clear();
        readerDiv.style.display = 'none';
        scanBtn.style.display = 'block';

        resultArea.style.display = 'block';
        barcodeResult.innerText = "EAN: " + decodedText;

        sendToBackend(decodedText);
    }

    let dailyKcalTarget = 0;
    let currentXp = 0;
    let currentLevel = 0;
    const maxXp = 1000;

    // send to backend
    async function sendToBackend(barcode) {
        try {
            barcodeResult.innerText = "EAN: " + barcode + "\nSuche in Datenbank...";
            const response = await fetch('/api/scan', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ barcode: barcode })
            });
            const data = await response.json();

            if(data.success) {
                barcodeResult.innerHTML = `
                        <strong style="font-size: 1.2em;">${data.name}</strong><br><br>
                        Kalorien: <strong>${data.kcal} kcal</strong> pro 100g<br><br>
                        <button class="btn" style="background-color: #4caf50;" onclick="addMeal(${data.kcal}, '${data.name.replace(/'/g, "")}')">Als Mahlzeit eintragen</button>
                    `;
            } else {
                barcodeResult.innerHTML = `<span style="color: red;">${data.message}</span>`;
            }
        } catch (error) {
            console.error("Fehler:", error);
            barcodeResult.innerText = "Verbindungsfehler zum Server.";
        }
    }

    async function register() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const res = await fetch('/api/register', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();
        if (data.success) {
            alert("Erfolgreich registriert! Du kannst dich nun einloggen.");
        } else {
            document.getElementById('auth-message').innerText = data.message;
        }
    }

    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const res = await fetch('/api/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('nutriQuestToken', data.token);
            loadGame();
        } else {
            document.getElementById('auth-message').innerText = data.message;
        }
    }

    function logout() {
        localStorage.removeItem('nutriQuestToken');
        location.reload();
    }

    window.onload = () => {
        const savedToken = localStorage.getItem('nutriQuestToken');
        if (savedToken) loadGame();
    };

    async function loadGame() {
        const token = localStorage.getItem('nutriQuestToken');
        const response = await fetch('/api/user/me', { headers: { 'Authorization': token } });

        if (response.status === 403 || response.status === 401) {
            logout(); return;
        }

        document.getElementById('auth-container').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';

        const data = await response.json();
        dailyKcalTarget = data.daily_kcal;
        currentXp = data.xp;
        currentLevel = data.level;

        updateUI();
        updateDateDisplay();
        loadDiaryEntries();
    }

    function changeDate(daysOffset) {
        let date = new Date(currentSelectedDate);
        date.setDate(date.getDate() + daysOffset);
        currentSelectedDate = date.toISOString().split('T')[0];

        updateDateDisplay();
        loadDiaryEntries();
    }

    function updateDateDisplay() {
        const today = new Date().toISOString().split('T')[0];
        const displayObj = document.getElementById('dateDisplay');
        if (currentSelectedDate === today) {
            displayObj.innerText = "📅 Heute (" + currentSelectedDate + ")";
        } else {
            displayObj.innerText = "📅 " + currentSelectedDate;
        }
    }

    async function loadDiaryEntries() {
        const token = localStorage.getItem('nutriQuestToken');
        const res = await fetch('/api/diary/' + currentSelectedDate, {
            headers: { 'Authorization': token }
        });
        const meals = await res.json();

        const listContainer = document.getElementById('mealList');
        let totalEatenToday = 0;

        if (meals.length === 0) {
            listContainer.innerHTML = "<em>Keine Einträge an diesem Tag.</em>";
        } else {
            let html = "<ul style='padding-left: 20px; margin: 0;'>";
            meals.forEach(meal => {
                html += `<li><strong>${meal.food_name}</strong>: ${meal.grams}g (${meal.kcal_consumed} kcal)</li>`;
                totalEatenToday += meal.kcal_consumed;
            });
            html += "</ul>";
            listContainer.innerHTML = html;
        }

        let remainingKcal = dailyKcalTarget - totalEatenToday;
        document.getElementById('kcalDisplay').innerText = remainingKcal + " kcal";
    }

    function updateUI() {
        document.getElementById('levelDisplay').innerText = "⭐ Level " + currentLevel;
        document.getElementById('xpText').innerText = currentXp + " / " + maxXp + " XP";
        document.getElementById('xpFill').style.width = (currentXp / maxXp * 100) + "%";
    }

    async function addMeal(kcalPer100g, foodName) {
        let grams = prompt("Wie viel Gramm hast du von '" + foodName + "' gegessen?", "100");

        if (grams !== null && !isNaN(grams) && grams > 0) {
            let consumedKcal = Math.round((kcalPer100g * grams) / 100);

            currentXp += 75;
            if (currentXp >= maxXp) {
                currentLevel++;
                currentXp -= maxXp;
                alert("🎉 LEVEL UP! Du bist jetzt Level " + currentLevel + "!");
            }

            updateUI();
            document.getElementById('resultArea').style.display = 'none';

            const token = localStorage.getItem('nutriQuestToken');

            await fetch('/api/user/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': token },
                body: JSON.stringify({ level: currentLevel, xp: currentXp, daily_kcal: dailyKcalTarget })
            });

            await fetch('/api/diary/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': token },
                body: JSON.stringify({
                    date: currentSelectedDate,
                    food_name: foodName,
                    grams: parseInt(grams),
                    kcal_consumed: consumedKcal
                })
            });

            loadDiaryEntries();

        } else {
            alert("Bitte gib eine gültige Grammzahl ein!");
        }
    }
</script>
</body>
</html>
